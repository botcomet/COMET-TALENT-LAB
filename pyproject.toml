[project]
name = "comet-talent-lab"
version = "0.1.0"
description = "COMET Talent Lab — copilote métier Talent Management (sourcing, matching, qualification)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "cryptography>=42",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "reportlab", "playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "business: tests métier issus du référentiel Comet (cas réels anonymisés / fictifs)",
  "e2e: parcours navigateur (Playwright)",
]

[tool.setuptools.packages.find]
include = ["talentlab*"]
