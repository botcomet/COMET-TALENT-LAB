# Migrations de base de données (Alembic). L'URL vient de TALENTLAB_DATABASE_URL (jamais écrite ici).
#   python -m talentlab.manage migrate        # applique les migrations
#   python -m talentlab.manage current        # révision courante
[alembic]
script_location = talentlab/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
